[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarmesh"
version = "0.6.0"
description = "ScholarMesh — federated academic research retrieval MCP: 43 sources (OpenAlex, Crossref, arXiv, Europe PMC, PubMed, OpenAIRE, Zenodo, DataCite, OSF, zbMATH, ProofWiki, J-STAGE, CiNii, WHO IRIS, Indonesia & China platforms, premium indexes) behind 50 tools with one standardized result schema, parallel multi-keyword federation, and a TTL cache."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DranxX" }]
keywords = ["mcp", "scholar", "paper-search", "research", "openalex", "arxiv", "europepmc", "pubmed", "proofwiki", "federated"]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[project.scripts]
scholarmesh = "scholarmesh.server:main"
paper-research-mcp = "scholarmesh.server:main"  # legacy alias (pre-rename installs)

[tool.hatch.build.targets.wheel]
packages = ["src/scholarmesh"]
